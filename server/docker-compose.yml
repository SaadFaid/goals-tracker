services:
  db:
    image: postgres:16-alpine
    container_name: august-goals-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: august_goals
    ports:
      - "5432:5432"
    volumes:
      - august_goals_pgdata:/var/lib/postgresql/data

volumes:
  august_goals_pgdata:
