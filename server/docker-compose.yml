services:
  db:
    image: postgres:16-alpine
    container_name: august-goals-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paceline
    ports:
      - "5432:5432"
    volumes:
      - paceline_pgdata:/var/lib/postgresql/data

volumes:
  paceline_pgdata:
