services:
  - type: web
    name: goals-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && cd server && npm ci && npx prisma generate
    startCommand: cd server && node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: goals-tracker-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: "15m"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: CLIENT_ORIGIN
        sync: false
      - key: PORT
        value: "4000"

databases:
  - name: goals-tracker-db
    plan: free
